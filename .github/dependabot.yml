version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep @types/node on the 24.x LTS line we target (.node-version = 24,
      # CI = 22 + 24, engines >= 18). Types ahead of the oldest supported
      # runtime let APIs through that do not exist there — and the test
      # suite cannot catch that for consumers on older Node. The 25.x line
      # is odd-numbered and will never be LTS; 26.x is not Active LTS until
      # late Oct 2026. Majors are not banned: revisit for the 26.x line once
      # it is LTS and the CI matrix moves with it.
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
